name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven

    - name: Build and test
      run: ./mvnw verify -B

    - name: Docker build
      run: |
        docker build -t nabat-voting-app:${{ github.sha }} .
        docker tag nabat-voting-app:${{ github.sha }} nabat-voting-app:latest

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3
      with:
        dockerfile: Dockerfile
