jwt:
  # No default: refuses to start without a real JWT_SECRET (see JwtTokenProvider).
  # Must be the SAME value nabat-app uses, or tokens minted there will not validate here.
  # Generate with: openssl rand -base64 48
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

spring:
  application:
    name: nabat-voting

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5434/nabat_voting_db}
    username: ${SPRING_DATASOURCE_USERNAME:nabat_voting_user}
    password: ${SPRING_DATASOURCE_PASSWORD:nabat_voting_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    # Env-driven like every other setting here. This was the one hardcoded value, so a
    # containerised run could not point at its broker without editing the jar.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:nabat-voting-group}
      auto-offset-reset: earliest

nabat:
  kafka:
    # Must not exceed the broker count. Defaults to 1 because every environment in this
    # repository runs a single broker; raise it in production.
    topic-replicas: ${NABAT_KAFKA_TOPIC_REPLICAS:1}
    topic-partitions: ${NABAT_KAFKA_TOPIC_PARTITIONS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://nabat-zipkin:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%5p) [${spring.application.name},%X{traceId:-},%X{spanId:-}] [%t] %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

server:
  port: ${SERVER_PORT:8081}
